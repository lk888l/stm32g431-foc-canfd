name: FreeRTOS LTS currency
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: python3 tools/vendor.py --check-lts
        env:
          GITHUB_TOKEN: ${{ github.token }}
