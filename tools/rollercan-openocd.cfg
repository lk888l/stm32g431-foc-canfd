source [find interface/stlink.cfg]
# OpenOCD 0.12 uses HLA; newer builds use the native ST-Link driver.
if {[adapter name] eq "hla"} {
    transport select hla_swd
} elseif {[lsearch -exact [transport list] dapdirect_swd] >= 0} {
    transport select dapdirect_swd
} else {
    transport select swd
}
source [find target/stm32g4x.cfg]
adapter speed 1800
bindto 127.0.0.1
gdb_port 3333
tcl_port 6666
telnet_port disabled
